# Stops :0's Xorg from auto-binding the Intel iGPU as a secondary PRIME
# provider at startup. Needed so a standalone Xorg :1 (see igpu-server-up.sh)
# can take DRM master on the iGPU — :0 holding it as a provider blocks that
# even when its outputs are off via xrandr.
#
# Install: copy to /etc/X11/xorg.conf.d/, takes effect on next X (re)login.

Section "ServerFlags"
    Option "AutoBindGPU" "false"
EndSection
