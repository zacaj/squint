# Standalone Xorg server for the Intel Arrow Lake iGPU (PCI:0:2:0)
# Used as :1 for cross-server Squint testing.
# No input devices — the iGPU monitors show mirrors only.

Section "Device"
    Identifier  "IntelIGPU"
    Driver      "modesetting"
    BusID       "PCI:0:2:0"
    Option      "kmsdev" "/dev/dri/card1"
    Option      "AccelMethod" "glamor"
EndSection

Section "Screen"
    Identifier "iGPUScreen"
    Device     "IntelIGPU"
EndSection

Section "ServerLayout"
    Identifier "iGPULayout"
    Screen 0   "iGPUScreen"
    Option     "AutoAddGPU" "false"
    Option     "AutoBindGPU" "false"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
    # Output-only server: do NOT auto-add the physical mouse/keyboard via udev.
    # Without this, :1 grabs the same input devices as :0, giving it its own
    # pointer that moves with the mouse and draws a phantom second cursor on the
    # mirrors. With it, :1 has only an inert virtual core pointer.
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    # Never blank or power down the mirrors. X's idle timer is driven purely by
    # input events; this server has no input devices, so its idle time only ever
    # counts up and the screensaver fires ~10 min after startup regardless of
    # squint drawing to it. These must be set here, not via xset(1): when squint
    # exits, :1 has zero clients and X does a full server reset, which restores
    # the config defaults (and repaints the root black).
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
